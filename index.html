<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Silent Room</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- CryptoJS for AES-256 Encryption -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <style>
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    audio::-webkit-media-controls-panel { background-color: #0f172a; }
    audio::-webkit-media-controls-current-time-display,
    audio::-webkit-media-controls-time-remaining-display { color: #94a3b8; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-2 sm:p-4 font-sans select-none">

  <!-- Authentication / Password Screen -->
  <div id="auth-card" class="bg-slate-900 p-6 sm:p-8 rounded-2xl shadow-2xl w-full max-w-md space-y-5 border border-slate-800">
    <div class="text-center space-y-1">
      <div class="inline-flex items-center justify-center w-12 h-12 rounded-full bg-indigo-500/10 text-indigo-400 mb-2">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
      </div>
      <h1 class="text-2xl font-bold tracking-tight text-indigo-400">Silent Room</h1>
      <p class="text-xs text-slate-400">Enter your secret security access code</p>
    </div>

    <div>
      <input id="pass-input" type="password" placeholder="••••••" class="w-full p-3.5 rounded-xl bg-slate-950 border border-slate-800 focus:outline-none focus:border-indigo-500 text-center tracking-widest text-lg transition text-slate-100 placeholder-slate-600">
    </div>

    <div id="error-msg" class="text-xs text-rose-500 text-center hidden font-medium">Incorrect password! Please try again.</div>

    <button onclick="login()" class="w-full bg-indigo-600 hover:bg-indigo-500 py-3.5 rounded-xl font-semibold transition text-sm shadow-lg shadow-indigo-600/20 active:scale-[0.99]">Enter Room</button>
  </div>

  <!-- Chat Screen -->
  <div id="chat-card" class="bg-slate-900 rounded-2xl shadow-2xl w-full max-w-lg border border-slate-800 flex flex-col h-[95vh] sm:h-[90vh] hidden overflow-hidden relative">
    
    <!-- Header -->
    <div class="p-3 sm:p-3.5 border-b border-slate-800 flex justify-between items-center bg-slate-900/90 backdrop-blur">
      <div class="flex items-center gap-2.5">
        <div class="w-9 h-9 rounded-xl bg-indigo-600/20 border border-indigo-500/30 flex items-center justify-center text-indigo-400 font-bold text-sm">
          SR
        </div>
        <div>
          <div class="font-bold text-xs sm:text-sm flex items-center gap-1.5">
            <span>Silent Room</span>
            <span id="role-badge" class="text-[9px] px-1.5 py-0.5 rounded bg-indigo-500/20 text-indigo-300 font-mono border border-indigo-500/30"></span>
          </div>
          <!-- Peer Status Indicator with Last Seen -->
          <div id="peer-status" class="text-[10px] text-slate-400 flex items-center gap-1 mt-0.5 font-medium">
            <span id="peer-dot" class="w-1.5 h-1.5 rounded-full bg-slate-600"></span>
            <span id="peer-status-text">Checking status...</span>
          </div>
        </div>
      </div>

      <!-- Action Buttons: Audio Call, Video Call, Exit -->
      <div class="flex items-center gap-1 sm:gap-1.5">
        <button onclick="initiateCall('audio')" title="Voice Call" class="p-2 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 hover:text-emerald-400 border border-slate-700 transition">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"></path></svg>
        </button>

        <button onclick="initiateCall('video')" title="Video Call" class="p-2 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 hover:text-indigo-400 border border-slate-700 transition">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
        </button>

        <button onclick="logout()" class="text-xs bg-slate-800 hover:bg-rose-950 hover:text-rose-300 text-slate-400 px-2.5 py-1.5 rounded-lg border border-slate-700/50 transition">Exit</button>
      </div>
    </div>

    <!-- Messages Container -->
    <div id="messages-container" class="flex-1 overflow-y-auto p-4 space-y-3.5"></div>

    <!-- Media Preview Area -->
    <div id="media-preview-container" class="px-4 py-2 bg-slate-950/80 border-t border-slate-800 hidden flex items-center justify-between">
      <div class="flex items-center gap-2 overflow-hidden">
        <div id="preview-element"></div>
        <div class="flex flex-col">
          <span id="preview-filename" class="text-xs text-slate-300 truncate max-w-[180px]"></span>
          <span id="preview-status" class="text-[10px] text-emerald-400 font-medium"></span>
        </div>
      </div>
      <button onclick="clearMediaSelection()" class="text-xs text-rose-400 hover:text-rose-300 p-1">✕ Cancel</button>
    </div>

    <!-- Voice Recording Active Bar -->
    <div id="recording-bar" class="px-4 py-2.5 bg-rose-950/40 border-t border-rose-900/50 hidden flex items-center justify-between">
      <div class="flex items-center gap-2">
        <span class="w-3 h-3 rounded-full bg-rose-500 animate-ping"></span>
        <span class="text-xs font-semibold text-rose-400">Recording Voice:</span>
        <span id="recording-timer" class="text-xs font-mono text-slate-200">00:00</span>
      </div>
      <div class="flex items-center gap-2">
        <button onclick="cancelVoiceRecording()" class="text-xs bg-slate-800 hover:bg-slate-700 text-rose-400 px-2.5 py-1.5 rounded-lg border border-slate-700 transition">✕ Cancel</button>
        <button onclick="stopAndSendVoiceRecording()" class="text-xs bg-rose-600 hover:bg-rose-500 text-white px-3 py-1.5 rounded-lg font-semibold shadow transition">Send Voice</button>
      </div>
    </div>

    <!-- Message Input Form -->
    <form id="chat-input-form" onsubmit="sendMessage(event)" class="p-2 sm:p-3 border-t border-slate-800 flex items-center gap-1.5 sm:gap-2 bg-slate-900">
      <label class="cursor-pointer bg-slate-800 hover:bg-slate-700 p-2 sm:p-2.5 rounded-xl border border-slate-700/60 transition flex items-center justify-center text-slate-300 hover:text-white shrink-0" title="Attach image or video">
        <svg class="w-4 h-4 sm:w-5 sm:h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.172 7l-6.586 6.586a2 2 0 102.828 2.828l6.414-6.586a4 4 0 00-5.656-5.656l-6.415 6.585a6 6 0 108.486 8.486L20.5 13"></path></svg>
        <input id="file-input" type="file" accept="image/*,video/*" class="hidden" onchange="handleFileSelect(event)">
      </label>

      <button type="button" onclick="startVoiceRecording()" class="bg-slate-800 hover:bg-slate-700 p-2 sm:p-2.5 rounded-xl border border-slate-700/60 transition flex items-center justify-center text-slate-300 hover:text-rose-400 shrink-0" title="Record voice message">
        <svg class="w-4 h-4 sm:w-5 sm:h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"></path></svg>
      </button>

      <input id="msg-input" type="text" placeholder="Type a message..." autocomplete="off" class="min-w-0 flex-1 bg-slate-950 border border-slate-800 rounded-xl px-3 sm:px-4 py-2 text-xs sm:text-sm focus:outline-none focus:border-indigo-500 text-slate-100 placeholder-slate-500">
      
      <button type="submit" id="send-btn" class="bg-indigo-600 hover:bg-indigo-500 px-3 sm:px-4 py-2 rounded-xl text-xs sm:text-sm font-semibold transition shrink-0 shadow-md shadow-indigo-600/20 active:scale-95 flex items-center justify-center gap-1">
        <span id="send-text">Send</span>
        <svg class="w-3.5 h-3.5 sm:w-4 sm:h-4 rotate-45 mb-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path></svg>
        <span id="send-spinner" class="hidden animate-spin h-3.5 w-3.5 border-2 border-white border-t-transparent rounded-full"></span>
      </button>
    </form>

    <!-- Call Overlay Screen -->
    <div id="call-modal" class="absolute inset-0 bg-slate-950/95 z-50 hidden flex flex-col items-center justify-center p-4">
      <div id="incoming-call-box" class="hidden text-center space-y-4">
        <div class="w-16 h-16 rounded-full bg-indigo-600/20 border border-indigo-500 text-indigo-400 mx-auto flex items-center justify-center animate-bounce">
          <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"></path></svg>
        </div>
        <div>
          <h3 id="incoming-caller-title" class="text-lg font-bold text-white">Incoming Call...</h3>
          <p id="incoming-call-type" class="text-xs text-slate-400 mt-0.5">Secure Peer-to-Peer</p>
        </div>
        <div class="flex gap-4 justify-center pt-2">
          <button onclick="rejectCall()" class="bg-rose-600 hover:bg-rose-500 px-5 py-2.5 rounded-xl font-semibold text-xs transition">Decline</button>
          <button onclick="acceptCall()" class="bg-emerald-600 hover:bg-emerald-500 px-5 py-2.5 rounded-xl font-semibold text-xs transition shadow-lg shadow-emerald-600/30">Accept</button>
        </div>
      </div>

      <!-- Active Call Interface -->
      <div id="active-call-box" class="w-full h-full flex flex-col items-center justify-between hidden">
        <div class="text-center pt-3">
          <span id="call-status-label" class="text-xs font-mono text-emerald-400 animate-pulse">Connecting...</span>
        </div>
        
        <div class="relative w-full flex-1 my-3 flex items-center justify-center overflow-hidden rounded-2xl bg-slate-900 border border-slate-800">
          <video id="remote-video" autoplay playsinline class="w-full h-full object-cover"></video>
          <video id="local-video" autoplay playsinline muted class="absolute bottom-3 right-3 w-24 h-32 object-cover rounded-xl border border-slate-700 shadow-xl bg-slate-950"></video>
          <div id="audio-call-placeholder" class="hidden flex flex-col items-center gap-3">
            <div class="w-20 h-20 rounded-full bg-indigo-600/20 border border-indigo-500 flex items-center justify-center text-indigo-400">
              <svg class="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"></path></svg>
            </div>
            <p class="text-xs text-slate-400 font-mono">End-to-End Encrypted Voice</p>
          </div>
        </div>

        <div class="pb-4">
          <button onclick="endCall()" class="bg-rose-600 hover:bg-rose-500 text-white px-6 py-2.5 rounded-xl text-xs font-semibold shadow-lg shadow-rose-600/30 transition flex items-center gap-2">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 8l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2M5 3a2 2 0 00-2 2v1c0 8.284 6.716 15 15 15h1a2 2 0 002-2v-3.28a1 1 0 00-.684-.948l-4.493-1.498a1 1 0 00-1.21.502l-1.13 2.257a11.042 11.042 0 01-5.516-5.517l2.257-1.128a1 1 0 00.502-1.21L9.228 3.683A1 1 0 008.279 3H5z"></path></svg>
            End Call
          </button>
        </div>
      </div>
    </div>

  </div>

  <script>
    // =============================================================
    // Configuration & Settings
    // =============================================================
    const USER1_PASSWORD = "CD&852"; // User 1
    const USER2_PASSWORD = "GF$987"; // User 2
    const ENCRYPTION_SECRET = "SilentRoom_SecretKey_2026_SecureAES";

    // Change this value to adjust expiration duration (e.g., 2, 12, 24 hours)
    const MESSAGE_EXPIRE_HOURS = 1; 
    // =============================================================

    const firebaseConfig = {
      apiKey: "AIzaSyDHq8YSDNWeyxRISG043Yj3DsO4rJXBqzc",
      authDomain: "my--chat-ac71f.firebaseapp.com",
      projectId: "my--chat-ac71f",
      storageBucket: "my--chat-ac71f.firebasestorage.app",
      messagingSenderId: "437889471942",
      appId: "1:437889471942:web:7594024e05f65d2ea6cec7"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let currentUserRole = null;
    let peerUserRole = null;
    let isPeerOnline = false;
    let presenceHeartbeat = null;

    let selectedMedia = null;
    let isCompressing = false;
    const FIXED_ROOM_ID = "silent_room_global";

    let mediaRecorder = null;
    let audioChunks = [];
    let recordingTimerInterval = null;
    let recordingSeconds = 0;
    let isRecordingCancelled = false;

    let peerConnection = null;
    let localStream = null;
    let callType = 'audio';
    let currentCallData = null;
    const rtcConfig = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };

    function encryptData(text) {
      if (!text) return "";
      return CryptoJS.AES.encrypt(text, ENCRYPTION_SECRET).toString();
    }

    function decryptData(ciphertext) {
      if (!ciphertext) return "";
      try {
        const bytes = CryptoJS.AES.decrypt(ciphertext, ENCRYPTION_SECRET);
        return bytes.toString(CryptoJS.enc.Utf8);
      } catch (e) {
        return "[Unable to decrypt message]";
      }
    }

    function login() {
      const pass = document.getElementById('pass-input').value.trim();
      const errorMsg = document.getElementById('error-msg');
      errorMsg.classList.add('hidden');

      if (pass === USER1_PASSWORD) {
        currentUserRole = 'User 1';
        peerUserRole = 'User 2';
      } else if (pass === USER2_PASSWORD) {
        currentUserRole = 'User 2';
        peerUserRole = 'User 1';
      } else {
        errorMsg.classList.remove('hidden');
        return;
      }

      document.getElementById('auth-card').classList.add('hidden');
      document.getElementById('chat-card').classList.remove('hidden');
      document.getElementById('role-badge').innerText = currentUserRole;

      startChat();
      setupPresence();
      listenForIncomingCalls();
    }

    function logout() {
      if (currentUserRole) {
        db.collection('rooms').doc(FIXED_ROOM_ID).collection('presence').doc(currentUserRole).set({
          online: false,
          lastSeen: Date.now()
        }).catch(() => {});
      }
      location.reload();
    }

    // ---------------- Presence & Last Seen System ----------------
    function setupPresence() {
      const myPresenceRef = db.collection('rooms').doc(FIXED_ROOM_ID).collection('presence').doc(currentUserRole);
      
      const updatePresence = () => {
        myPresenceRef.set({ online: true, lastSeen: Date.now() });
      };

      updatePresence();
      presenceHeartbeat = setInterval(updatePresence, 5000);

      window.addEventListener('beforeunload', () => {
        myPresenceRef.set({ online: false, lastSeen: Date.now() });
      });

      // Listen to peer's presence & last seen
      db.collection('rooms').doc(FIXED_ROOM_ID).collection('presence').doc(peerUserRole)
        .onSnapshot(doc => {
          const data = doc.data();
          const dot = document.getElementById('peer-dot');
          const text = document.getElementById('peer-status-text');

          if (data && data.online && (Date.now() - data.lastSeen < 12000)) {
            isPeerOnline = true;
            dot.className = "w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse";
            text.className = "text-emerald-400 font-semibold";
            text.innerText = "Online";
          } else {
            isPeerOnline = false;
            dot.className = "w-1.5 h-1.5 rounded-full bg-slate-600";
            text.className = "text-slate-400 font-normal";
            
            if (data && data.lastSeen) {
              text.innerText = `Last seen at ${formatTime(data.lastSeen)}`;
            } else {
              text.innerText = "Offline";
            }
          }
        });
    }

    // ---------------- Peer-to-Peer Calling ----------------
    async function initiateCall(type) {
      if (!isPeerOnline) {
        alert(`${peerUserRole} is currently offline. Calling is disabled when peer is not active in room.`);
        return;
      }

      callType = type;
      try {
        localStream = await navigator.mediaDevices.getUserMedia({
          audio: true,
          video: type === 'video'
        });

        setupCallUI(type, true);

        peerConnection = new RTCPeerConnection(rtcConfig);
        localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));

        peerConnection.ontrack = (event) => {
          document.getElementById('remote-video').srcObject = event.streams[0];
          document.getElementById('call-status-label').innerText = "Connected (Encrypted)";
        };

        const callDoc = db.collection('rooms').doc(FIXED_ROOM_ID).collection('calls').doc('active');
        const offerCandidates = callDoc.collection('offerCandidates');
        const answerCandidates = callDoc.collection('answerCandidates');

        peerConnection.onicecandidate = (event) => {
          if (event.candidate) offerCandidates.add(event.candidate.toJSON());
        };

        const offerDescription = await peerConnection.createOffer();
        await peerConnection.setLocalDescription(offerDescription);

        await callDoc.set({
          caller: currentUserRole,
          receiver: peerUserRole,
          type: type,
          status: 'calling',
          offer: { sdp: offerDescription.sdp, type: offerDescription.type },
          timestamp: Date.now()
        });

        callDoc.onSnapshot(snapshot => {
          const data = snapshot.data();
          if (data && data.status === 'rejected') {
            alert("Call was declined.");
            endCall();
          } else if (data && !peerConnection.currentRemoteDescription && data.answer) {
            const answerDescription = new RTCSessionDescription(data.answer);
            peerConnection.setRemoteDescription(answerDescription);
          } else if (!data) {
            endCallCleanup();
          }
        });

        answerCandidates.onSnapshot(snapshot => {
          snapshot.docChanges().forEach(change => {
            if (change.type === 'added') {
              peerConnection.addIceCandidate(new RTCIceCandidate(change.doc.data()));
            }
          });
        });

      } catch (err) {
        alert("Camera or Microphone permission required for calls.");
        endCall();
      }
    }

    function listenForIncomingCalls() {
      const callDoc = db.collection('rooms').doc(FIXED_ROOM_ID).collection('calls').doc('active');

      callDoc.onSnapshot(snapshot => {
        const data = snapshot.data();
        if (data && data.receiver === currentUserRole && data.status === 'calling') {
          if (Date.now() - data.timestamp < 15000) {
            currentCallData = data;
            document.getElementById('call-modal').classList.remove('hidden');
            document.getElementById('incoming-call-box').classList.remove('hidden');
            document.getElementById('active-call-box').classList.add('hidden');
            document.getElementById('incoming-caller-title').innerText = `${data.caller} Calling...`;
            document.getElementById('incoming-call-type').innerText = `${data.type.toUpperCase()} Call Request`;
          }
        } else if (!data && peerConnection) {
          endCallCleanup();
        }
      });
    }

    async function acceptCall() {
      if (!currentCallData) return;
      callType = currentCallData.type;

      try {
        localStream = await navigator.mediaDevices.getUserMedia({
          audio: true,
          video: callType === 'video'
        });

        setupCallUI(callType, false);

        peerConnection = new RTCPeerConnection(rtcConfig);
        localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));

        peerConnection.ontrack = (event) => {
          document.getElementById('remote-video').srcObject = event.streams[0];
          document.getElementById('call-status-label').innerText = "Connected (Encrypted)";
        };

        const callDoc = db.collection('rooms').doc(FIXED_ROOM_ID).collection('calls').doc('active');
        const answerCandidates = callDoc.collection('answerCandidates');
        const offerCandidates = callDoc.collection('offerCandidates');

        peerConnection.onicecandidate = (event) => {
          if (event.candidate) answerCandidates.add(event.candidate.toJSON());
        };

        await peerConnection.setRemoteDescription(new RTCSessionDescription(currentCallData.offer));
        const answerDescription = await peerConnection.createAnswer();
        await peerConnection.setLocalDescription(answerDescription);

        await callDoc.update({
          status: 'connected',
          answer: { type: answerDescription.type, sdp: answerDescription.sdp }
        });

        offerCandidates.onSnapshot(snapshot => {
          snapshot.docChanges().forEach(change => {
            if (change.type === 'added') {
              peerConnection.addIceCandidate(new RTCIceCandidate(change.doc.data()));
            }
          });
        });

      } catch (err) {
        alert("Camera or Microphone permission denied.");
        rejectCall();
      }
    }

    async function rejectCall() {
      const callDoc = db.collection('rooms').doc(FIXED_ROOM_ID).collection('calls').doc('active');
      await callDoc.update({ status: 'rejected' }).catch(() => {});
      setTimeout(() => callDoc.delete().catch(() => {}), 1000);
      endCallCleanup();
    }

    async function endCall() {
      const callDoc = db.collection('rooms').doc(FIXED_ROOM_ID).collection('calls').doc('active');
      await callDoc.delete().catch(() => {});
      endCallCleanup();
    }

    function endCallCleanup() {
      if (localStream) {
        localStream.getTracks().forEach(track => track.stop());
        localStream = null;
      }
      if (peerConnection) {
        peerConnection.close();
        peerConnection = null;
      }
      currentCallData = null;
      document.getElementById('call-modal').classList.add('hidden');
      document.getElementById('incoming-call-box').classList.add('hidden');
      document.getElementById('active-call-box').classList.add('hidden');
      document.getElementById('remote-video').srcObject = null;
      document.getElementById('local-video').srcObject = null;
    }

    function setupCallUI(type, isCaller) {
      document.getElementById('call-modal').classList.remove('hidden');
      document.getElementById('incoming-call-box').classList.add('hidden');
      document.getElementById('active-call-box').classList.remove('hidden');
      document.getElementById('call-status-label').innerText = isCaller ? "Ringing peer..." : "Connecting...";

      const placeholder = document.getElementById('audio-call-placeholder');
      const localVid = document.getElementById('local-video');
      const remoteVid = document.getElementById('remote-video');

      if (type === 'video') {
        placeholder.classList.add('hidden');
        localVid.classList.remove('hidden');
        remoteVid.classList.remove('hidden');
        localVid.srcObject = localStream;
      } else {
        placeholder.classList.remove('hidden');
        localVid.classList.add('hidden');
        remoteVid.classList.add('hidden');
      }
    }

    // ---------------- Messaging System ----------------
    function compressImage(file, maxWidth = 1000, maxHeight = 1000, quality = 0.65) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = (event) => {
          const img = new Image();
          img.src = event.target.result;
          img.onload = () => {
            let width = img.width;
            let height = img.height;
            if (width > height) {
              if (width > maxWidth) {
                height = Math.round((height * maxWidth) / width);
                width = maxWidth;
              }
            } else {
              if (height > maxHeight) {
                width = Math.round((width * maxHeight) / height);
                height = maxHeight;
              }
            }
            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);
            resolve(canvas.toDataURL('image/jpeg', quality));
          };
          img.onerror = reject;
        };
        reader.onerror = reject;
      });
    }

    async function handleFileSelect(e) {
      const file = e.target.files[0];
      if (!file) return;

      const isImage = file.type.startsWith('image/');
      const isVideo = file.type.startsWith('video/');

      if (!isImage && !isVideo) {
        alert("Please select an image or video file only.");
        e.target.value = '';
        return;
      }

      const previewContainer = document.getElementById('media-preview-container');
      const previewElement = document.getElementById('preview-element');
      const previewFilename = document.getElementById('preview-filename');
      const previewStatus = document.getElementById('preview-status');

      previewFilename.innerText = file.name;
      previewStatus.innerText = "Processing...";
      previewContainer.classList.remove('hidden');
      isCompressing = true;

      try {
        if (isImage) {
          previewElement.innerHTML = `<span class="text-xs bg-indigo-900 text-indigo-300 px-1.5 py-0.5 rounded">🖼️ Optimizing</span>`;
          const compressedData = await compressImage(file);
          selectedMedia = { type: 'image', data: compressedData, name: file.name };
          previewElement.innerHTML = `<img src="${compressedData}" class="w-9 h-9 object-cover rounded-lg border border-slate-700">`;
          previewStatus.innerText = "✓ Ready";
        } else if (isVideo) {
          if (file.size > 800 * 1024) {
            alert("Video file exceeds 800 KB limit. Please select a short 3-4 second clip.");
            clearMediaSelection();
            return;
          }
          const reader = new FileReader();
          reader.onload = function(evt) {
            selectedMedia = { type: 'video', data: evt.target.result, name: file.name };
            previewElement.innerHTML = `<span class="text-xs bg-indigo-900 text-indigo-300 px-1.5 py-0.5 rounded">🎬 Video</span>`;
            previewStatus.innerText = "✓ Ready";
          };
          reader.readAsDataURL(file);
        }
      } catch (err) {
        alert("Error processing file.");
        clearMediaSelection();
      } finally {
        isCompressing = false;
      }
    }

    function clearMediaSelection() {
      selectedMedia = null;
      document.getElementById('file-input').value = '';
      document.getElementById('media-preview-container').classList.add('hidden');
    }

    async function startVoiceRecording() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        audioChunks = [];
        isRecordingCancelled = false;

        mediaRecorder = new MediaRecorder(stream);
        mediaRecorder.ondataavailable = (e) => {
          if (e.data.size > 0) audioChunks.push(e.data);
        };

        mediaRecorder.onstop = async () => {
          stream.getTracks().forEach(track => track.stop());
          clearInterval(recordingTimerInterval);

          if (!isRecordingCancelled && audioChunks.length > 0) {
            const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
            if (audioBlob.size > 800 * 1024) {
              alert("Audio clip is too long. Please keep it under 1 minute.");
              return;
            }
            const reader = new FileReader();
            reader.onloadend = async () => {
              await sendDirectMessage({ text: "", mediaData: reader.result, mediaType: "audio" });
            };
            reader.readAsDataURL(audioBlob);
          }
        };

        mediaRecorder.start();
        recordingSeconds = 0;
        document.getElementById('recording-timer').innerText = "00:00";
        document.getElementById('recording-bar').classList.remove('hidden');
        document.getElementById('chat-input-form').classList.add('opacity-40', 'pointer-events-none');

        recordingTimerInterval = setInterval(() => {
          recordingSeconds++;
          const mins = String(Math.floor(recordingSeconds / 60)).padStart(2, '0');
          const secs = String(recordingSeconds % 60).padStart(2, '0');
          document.getElementById('recording-timer').innerText = `${mins}:${secs}`;
          if (recordingSeconds >= 60) stopAndSendVoiceRecording();
        }, 1000);

      } catch (err) {
        alert("Microphone permission denied.");
      }
    }

    function stopAndSendVoiceRecording() {
      if (mediaRecorder && mediaRecorder.state !== 'inactive') {
        isRecordingCancelled = false;
        mediaRecorder.stop();
      }
      resetRecordingUI();
    }

    function cancelVoiceRecording() {
      if (mediaRecorder && mediaRecorder.state !== 'inactive') {
        isRecordingCancelled = true;
        mediaRecorder.stop();
      }
      resetRecordingUI();
    }

    function resetRecordingUI() {
      clearInterval(recordingTimerInterval);
      document.getElementById('recording-bar').classList.add('hidden');
      document.getElementById('chat-input-form').classList.remove('opacity-40', 'pointer-events-none');
    }

    function startChat() {
      const expireTimeLimit = Date.now() - (MESSAGE_EXPIRE_HOURS * 60 * 60 * 1000);

      db.collection('rooms').doc(FIXED_ROOM_ID).collection('messages')
        .where('timestamp', '>', expireTimeLimit)
        .orderBy('timestamp', 'asc')
        .onSnapshot(snapshot => {
          const container = document.getElementById('messages-container');
          container.innerHTML = '';

          snapshot.forEach(doc => {
            const msg = doc.data();
            const msgId = doc.id;
            const isMe = msg.sender === currentUserRole;

            if (!isMe && !msg.read) {
              db.collection('rooms').doc(FIXED_ROOM_ID).collection('messages').doc(msgId).update({
                read: true
              }).catch(() => {});
            }

            const decryptedText = decryptData(msg.cipherText);
            const decryptedMedia = decryptData(msg.cipherMedia);

            const bubble = document.createElement('div');
            bubble.className = `flex flex-col group ${isMe ? 'items-end' : 'items-start'}`;

            const isUser1 = msg.sender === 'User 1';
            const colorClass = isUser1 
              ? (isMe ? 'bg-indigo-600 text-white' : 'bg-slate-800 text-indigo-200 border border-indigo-500/30')
              : (isMe ? 'bg-emerald-600 text-white' : 'bg-slate-800 text-emerald-200 border border-emerald-500/30');

            let mediaHtml = '';
            if (msg.mediaType === 'image' && decryptedMedia) {
              mediaHtml = `<img src="${decryptedMedia}" class="rounded-xl max-h-64 mb-1.5 object-cover cursor-pointer hover:opacity-95 transition" onclick="openMedia('${decryptedMedia}')"/>`;
            } else if (msg.mediaType === 'video' && decryptedMedia) {
              mediaHtml = `<video controls class="rounded-xl max-h-64 mb-1.5 w-full bg-black"><source src="${decryptedMedia}"></video>`;
            } else if (msg.mediaType === 'audio' && decryptedMedia) {
              mediaHtml = `<div class="flex items-center gap-2 py-1"><audio controls class="h-9 w-52 sm:w-60"><source src="${decryptedMedia}" type="audio/webm"></audio></div>`;
            }

            const textHtml = decryptedText ? `<div class="leading-relaxed">${escapeHtml(decryptedText)}</div>` : '';

            let statusIndicator = '';
            if (isMe) {
              statusIndicator = msg.read 
                ? `<span class="text-sky-300 font-bold ml-1" title="Seen">✓✓</span>` 
                : `<span class="text-slate-400 font-semibold ml-1" title="Delivered">✓</span>`;
            }

            bubble.innerHTML = `
              <div class="flex items-center gap-1.5 mb-1 px-1">
                <span class="text-[10px] font-medium text-slate-400">${msg.sender}</span>
                <span class="text-[9px] text-slate-500">${formatTime(msg.timestamp)}</span>
                ${statusIndicator}
                <button onclick="deleteMessage('${msgId}')" title="Delete for everyone" class="opacity-0 group-hover:opacity-100 hover:text-rose-400 text-slate-500 transition text-xs ml-1">🗑️</button>
              </div>
              <div class="px-3.5 py-2.5 rounded-2xl max-w-[85%] sm:max-w-[75%] text-sm break-words shadow-md ${colorClass}">
                ${mediaHtml}
                ${textHtml}
              </div>
            `;
            container.appendChild(bubble);
          });
          container.scrollTop = container.scrollHeight;
        });
    }

    async function sendDirectMessage({ text = "", mediaData = "", mediaType = null }) {
      const sendBtn = document.getElementById('send-btn');
      const sendText = document.getElementById('send-text');
      const sendSpinner = document.getElementById('send-spinner');
      
      sendBtn.disabled = true;
      sendText.innerText = '...';
      sendSpinner.classList.remove('hidden');

      const cipherText = text ? encryptData(text) : "";
      const cipherMedia = mediaData ? encryptData(mediaData) : "";

      try {
        await db.collection('rooms').doc(FIXED_ROOM_ID).collection('messages').add({
          cipherText: cipherText,
          cipherMedia: cipherMedia,
          mediaType: mediaType,
          sender: currentUserRole,
          timestamp: Date.now(),
          read: false
        });
      } catch (err) {
        alert("Failed to send message: " + err.message);
      } finally {
        sendBtn.disabled = false;
        sendText.innerText = 'Send';
        sendSpinner.classList.add('hidden');
      }
    }

    async function sendMessage(e) {
      e.preventDefault();
      if (isCompressing) return;

      const input = document.getElementById('msg-input');
      const text = input.value.trim();
      if (!text && !selectedMedia) return;

      const mediaData = selectedMedia ? selectedMedia.data : "";
      const mediaType = selectedMedia ? selectedMedia.type : null;

      await sendDirectMessage({ text, mediaData, mediaType });
      input.value = '';
      clearMediaSelection();
    }

    async function deleteMessage(msgId) {
      if (confirm("Delete this message for everyone?")) {
        try {
          await db.collection('rooms').doc(FIXED_ROOM_ID).collection('messages').doc(msgId).delete();
        } catch (err) {
          alert("Failed to delete: " + err.message);
        }
      }
    }

    function openMedia(dataUrl) {
      const win = window.open();
      win.document.write(`<body style="margin:0;background:#050811;display:flex;align-items:center;justify-content:center;height:100vh;"><img src="${dataUrl}" style="max-height:100vh;max-width:100vw;object-fit:contain;"></body>`);
    }

    function formatTime(timestamp) {
      const d = new Date(timestamp);
      return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }

    function escapeHtml(str) {
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }
  </script>
