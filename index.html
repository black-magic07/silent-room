<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Silent Room</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- CryptoJS for AES-256 Client-side Encryption -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <style>
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-2 sm:p-4 font-sans select-none">

  <!-- Authentication / Password Screen -->
  <div id="auth-card" class="bg-slate-900 p-6 sm:p-8 rounded-2xl shadow-2xl w-full max-w-md space-y-5 border border-slate-800">
    <div class="text-center space-y-1">
      <div class="inline-flex items-center justify-center w-12 h-12 rounded-full bg-indigo-500/10 text-indigo-400 mb-2">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
      </div>
      <h1 class="text-2xl font-bold tracking-tight text-indigo-400">Silent Room</h1>
      <p class="text-xs text-slate-400">প্রবেশ করতে আপনার গোপন নিরাপত্তা কোড দিন</p>
    </div>

    <div>
      <input id="pass-input" type="password" placeholder="••••••" class="w-full p-3.5 rounded-xl bg-slate-950 border border-slate-800 focus:outline-none focus:border-indigo-500 text-center tracking-widest text-lg transition text-slate-100 placeholder-slate-600">
    </div>

    <div id="error-msg" class="text-xs text-rose-500 text-center hidden font-medium">ভুল পাসওয়ার্ড! পুনরায় চেষ্টা করুন।</div>

    <button onclick="login()" class="w-full bg-indigo-600 hover:bg-indigo-500 py-3.5 rounded-xl font-semibold transition text-sm shadow-lg shadow-indigo-600/20 active:scale-[0.99]">প্রবেশ করুন</button>
  </div>

  <!-- Chat Screen -->
  <div id="chat-card" class="bg-slate-900 rounded-2xl shadow-2xl w-full max-w-lg border border-slate-800 flex flex-col h-[95vh] sm:h-[90vh] hidden overflow-hidden">
    <!-- Header -->
    <div class="p-3.5 sm:p-4 border-b border-slate-800 flex justify-between items-center bg-slate-900/90 backdrop-blur">
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 rounded-xl bg-indigo-600/20 border border-indigo-500/30 flex items-center justify-center text-indigo-400 font-bold">
          SR
        </div>
        <div>
          <div class="font-bold text-sm sm:text-base flex items-center gap-2">
            <span>Silent Room</span>
            <span id="role-badge" class="text-[10px] px-2 py-0.5 rounded-md bg-indigo-500/20 text-indigo-300 font-mono border border-indigo-500/30"></span>
          </div>
          <div class="text-[11px] text-emerald-400 flex items-center gap-1">
            <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
            অটো কম্প্রেস • AES-256 • ১ ঘণ্টা
          </div>
        </div>
      </div>
      <button onclick="logout()" class="text-xs bg-slate-800 hover:bg-rose-950 hover:text-rose-300 text-slate-400 px-3 py-1.5 rounded-lg border border-slate-700/50 transition">প্রস্থান</button>
    </div>

    <!-- Messages Container -->
    <div id="messages-container" class="flex-1 overflow-y-auto p-4 space-y-3.5"></div>

    <!-- Media Preview & Status Area -->
    <div id="media-preview-container" class="px-4 py-2 bg-slate-950/80 border-t border-slate-800 hidden flex items-center justify-between">
      <div class="flex items-center gap-2 overflow-hidden">
        <div id="preview-element"></div>
        <div class="flex flex-col">
          <span id="preview-filename" class="text-xs text-slate-300 truncate max-w-[180px]"></span>
          <span id="preview-status" class="text-[10px] text-emerald-400 font-medium"></span>
        </div>
      </div>
      <button onclick="clearMediaSelection()" class="text-xs text-rose-400 hover:text-rose-300 p-1">✕ বাতিল</button>
    </div>

    <!-- Message Input Form -->
    <form onsubmit="sendMessage(event)" class="p-2.5 sm:p-3 border-t border-slate-800 flex items-center gap-2 bg-slate-900">
      <!-- File Attach Button -->
      <label class="cursor-pointer bg-slate-800 hover:bg-slate-700 p-2.5 rounded-xl border border-slate-700/60 transition flex items-center justify-center text-slate-300 hover:text-white shrink-0" title="ছবি বা ভিডিও নির্বাচন করুন">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.172 7l-6.586 6.586a2 2 0 102.828 2.828l6.414-6.586a4 4 0 00-5.656-5.656l-6.415 6.585a6 6 0 108.486 8.486L20.5 13"></path></svg>
        <input id="file-input" type="file" accept="image/*,video/*" class="hidden" onchange="handleFileSelect(event)">
      </label>

      <input id="msg-input" type="text" placeholder="মেসেজ লিখুন..." autocomplete="off" class="flex-1 bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-indigo-500 text-slate-100 placeholder-slate-500">
      
      <button type="submit" id="send-btn" class="bg-indigo-600 hover:bg-indigo-500 px-4 py-2.5 rounded-xl text-sm font-semibold transition shrink-0 shadow-md shadow-indigo-600/20 active:scale-95 flex items-center gap-1.5">
        <span id="send-text">পাঠান</span>
        <span id="send-spinner" class="hidden animate-spin h-3.5 w-3.5 border-2 border-white border-t-transparent rounded-full"></span>
      </button>
    </form>
  </div>

  <script>
    // -------------------------------------------------------------
    // পাসওয়ার্ড ও গোপন এনক্রিপশন কি (Fixed Configuration)
    // -------------------------------------------------------------
    const USER1_PASSWORD = "CD&852"; // User 1
    const USER2_PASSWORD = "GF$987"; // User 2
    const ENCRYPTION_SECRET = "SilentRoom_SecretKey_2026_SecureAES"; // AES-256 Private Secret Key
    const MESSAGE_EXPIRE_HOURS = 1; // ১ ঘণ্টা পর অটো ডিলিট
    // -------------------------------------------------------------

    // Firebase Configuration
    const firebaseConfig = {
      apiKey: "AIzaSyDHq8YSDNWeyxRISG043Yj3DsO4rJXBqzc",
      authDomain: "my--chat-ac71f.firebaseapp.com",
      projectId: "my--chat-ac71f",
      storageBucket: "my--chat-ac71f.firebasestorage.app",
      messagingSenderId: "437889471942",
      appId: "1:437889471942:web:7594024e05f65d2ea6cec7"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let currentUserRole = null;
    let selectedMedia = null;
    let isCompressing = false;
    const FIXED_ROOM_ID = "silent_room_global";

    function encryptData(text) {
      if (!text) return "";
      return CryptoJS.AES.encrypt(text, ENCRYPTION_SECRET).toString();
    }

    function decryptData(ciphertext) {
      if (!ciphertext) return "";
      try {
        const bytes = CryptoJS.AES.decrypt(ciphertext, ENCRYPTION_SECRET);
        return bytes.toString(CryptoJS.enc.Utf8);
      } catch (e) {
        return "[ডিক্রিপ্ট করা সম্ভব হয়নি]";
      }
    }

    function login() {
      const pass = document.getElementById('pass-input').value.trim();
      const errorMsg = document.getElementById('error-msg');
      errorMsg.classList.add('hidden');

      if (pass === USER1_PASSWORD) {
        currentUserRole = 'User 1';
      } else if (pass === USER2_PASSWORD) {
        currentUserRole = 'User 2';
      } else {
        errorMsg.classList.remove('hidden');
        return;
      }

      document.getElementById('auth-card').classList.add('hidden');
      document.getElementById('chat-card').classList.remove('hidden');
      document.getElementById('role-badge').innerText = currentUserRole;

      startChat();
    }

    function logout() {
      location.reload();
    }

    // HTML5 Canvas-based automatic image compression
    function compressImage(file, maxWidth = 1000, maxHeight = 1000, quality = 0.65) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = (event) => {
          const img = new Image();
          img.src = event.target.result;
          img.onload = () => {
            let width = img.width;
            let height = img.height;

            if (width > height) {
              if (width > maxWidth) {
                height = Math.round((height * maxWidth) / width);
                width = maxWidth;
              }
            } else {
              if (height > maxHeight) {
                width = Math.round((width * maxHeight) / height);
                height = maxHeight;
              }
            }

            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);

            const compressedBase64 = canvas.toDataURL('image/jpeg', quality);
            resolve(compressedBase64);
          };
          img.onerror = reject;
        };
        reader.onerror = reject;
      });
    }

    async function handleFileSelect(e) {
      const file = e.target.files[0];
      if (!file) return;

      const isImage = file.type.startsWith('image/');
      const isVideo = file.type.startsWith('video/');

      if (!isImage && !isVideo) {
        alert("শুধুমাত্র ছবি অথবা ভিডিও নির্বাচন করুন।");
        e.target.value = '';
        return;
      }

      const previewContainer = document.getElementById('media-preview-container');
      const previewElement = document.getElementById('preview-element');
      const previewFilename = document.getElementById('preview-filename');
      const previewStatus = document.getElementById('preview-status');

      previewFilename.innerText = file.name;
      previewStatus.innerText = "প্রসেস হচ্ছে...";
      previewContainer.classList.remove('hidden');
      isCompressing = true;

      try {
        if (isImage) {
          previewElement.innerHTML = `<span class="text-xs bg-indigo-900 text-indigo-300 px-1.5 py-0.5 rounded">🖼️ অপ্টিমাইজ হচ্ছে</span>`;
          const compressedData = await compressImage(file);
          
          selectedMedia = {
            type: 'image',
            data: compressedData,
            name: file.name
          };
          previewElement.innerHTML = `<img src="${compressedData}" class="w-9 h-9 object-cover rounded-lg border border-slate-700">`;
          previewStatus.innerText = "✓ অপ্টিমাইজড (প্রস্তুত)";
        } else if (isVideo) {
          if (file.size > 800 * 1024) {
            alert("ভিডিও সাইজ 800 KB-এর চেয়ে বড়। অনুগ্রহ করে ৩-৪ সেকেন্ডের শর্ট ভিডিও ক্লিপ দিন।");
            clearMediaSelection();
            return;
          }
          const reader = new FileReader();
          reader.onload = function(evt) {
            selectedMedia = {
              type: 'video',
              data: evt.target.result,
              name: file.name
            };
            previewElement.innerHTML = `<span class="text-xs bg-indigo-900 text-indigo-300 px-1.5 py-0.5 rounded">🎬 Video</span>`;
            previewStatus.innerText = "✓ প্রস্তুত";
          };
          reader.readAsDataURL(file);
        }
      } catch (err) {
        alert("ফাইল প্রসেসিং-এ সমস্যা হয়েছে। আবার চেষ্টা করুন।");
        clearMediaSelection();
      } finally {
        isCompressing = false;
      }
    }

    function clearMediaSelection() {
      selectedMedia = null;
      document.getElementById('file-input').value = '';
      document.getElementById('media-preview-container').classList.add('hidden');
    }

    function startChat() {
      const expireTimeLimit = Date.now() - (MESSAGE_EXPIRE_HOURS * 60 * 60 * 1000);

      db.collection('rooms').doc(FIXED_ROOM_ID).collection('messages')
        .where('timestamp', '>', expireTimeLimit)
        .orderBy('timestamp', 'asc')
        .onSnapshot(snapshot => {
          const container = document.getElementById('messages-container');
          container.innerHTML = '';

          snapshot.forEach(doc => {
            const msg = doc.data();
            const msgId = doc.id;
            const isMe = msg.sender === currentUserRole;

            const decryptedText = decryptData(msg.cipherText);
            const decryptedMedia = decryptData(msg.cipherMedia);

            const bubble = document.createElement('div');
            bubble.className = `flex flex-col group ${isMe ? 'items-end' : 'items-start'}`;

            const isUser1 = msg.sender === 'User 1';
            const colorClass = isUser1 
              ? (isMe ? 'bg-indigo-600 text-white' : 'bg-slate-800 text-indigo-200 border border-indigo-500/30')
              : (isMe ? 'bg-emerald-600 text-white' : 'bg-slate-800 text-emerald-200 border border-emerald-500/30');

            let mediaHtml = '';
            if (msg.mediaType === 'image' && decryptedMedia) {
              mediaHtml = `<img src="${decryptedMedia}" class="rounded-xl max-h-64 mb-1.5 object-cover cursor-pointer hover:opacity-95 transition" onclick="openMedia('${decryptedMedia}')"/>`;
            } else if (msg.mediaType === 'video' && decryptedMedia) {
              mediaHtml = `<video controls class="rounded-xl max-h-64 mb-1.5 w-full bg-black"><source src="${decryptedMedia}"></video>`;
            }

            const textHtml = decryptedText ? `<div class="leading-relaxed">${escapeHtml(decryptedText)}</div>` : '';

            bubble.innerHTML = `
              <div class="flex items-center gap-1.5 mb-1 px-1">
                <span class="text-[10px] font-medium text-slate-400">${msg.sender}</span>
                <span class="text-[9px] text-slate-500">${formatTime(msg.timestamp)}</span>
                <button onclick="deleteMessage('${msgId}')" title="সবার জন্য মুছে ফেলুন" class="opacity-0 group-hover:opacity-100 hover:text-rose-400 text-slate-500 transition text-xs ml-1">🗑️</button>
              </div>
              <div class="px-3.5 py-2.5 rounded-2xl max-w-[85%] sm:max-w-[75%] text-sm break-words shadow-md ${colorClass}">
                ${mediaHtml}
                ${textHtml}
              </div>
            `;
            container.appendChild(bubble);
          });
          container.scrollTop = container.scrollHeight;
        });
    }

    async function sendMessage(e) {
      e.preventDefault();
      if (isCompressing) {
        alert("ছবি প্রসেস হচ্ছে, অনুগ্রহ করে এক সেকেন্ড অপেক্ষা করুন...");
        return;
      }

      const input = document.getElementById('msg-input');
      const text = input.value.trim();

      if (!text && !selectedMedia) return;

      const sendBtn = document.getElementById('send-btn');
      const sendText = document.getElementById('send-text');
      const sendSpinner = document.getElementById('send-spinner');
      
      sendBtn.disabled = true;
      sendText.innerText = 'পাঠানো হচ্ছে...';
      sendSpinner.classList.remove('hidden');

      const cipherText = text ? encryptData(text) : "";
      const cipherMedia = selectedMedia ? encryptData(selectedMedia.data) : "";
      const mediaType = selectedMedia ? selectedMedia.type : null;

      try {
        await db.collection('rooms').doc(FIXED_ROOM_ID).collection('messages').add({
          cipherText: cipherText,
          cipherMedia: cipherMedia,
          mediaType: mediaType,
          sender: currentUserRole,
          timestamp: Date.now()
        });
        input.value = '';
        clearMediaSelection();
      } catch (err) {
        alert("পাঠাতে সমস্যা হয়েছে: " + err.message);
      } finally {
        sendBtn.disabled = false;
        sendText.innerText = 'পাঠান';
        sendSpinner.classList.add('hidden');
      }
    }

    async function deleteMessage(msgId) {
      if (confirm("এই মেসেজটি কি সবার জন্য মুছে ফেলতে চান?")) {
        try {
          await db.collection('rooms').doc(FIXED_ROOM_ID).collection('messages').doc(msgId).delete();
        } catch (err) {
          alert("মুছতে সমস্যা হয়েছে: " + err.message);
        }
      }
    }

    function openMedia(dataUrl) {
      const win = window.open();
      win.document.write(`<body style="margin:0;background:#050811;display:flex;align-items:center;justify-content:center;height:100vh;"><img src="${dataUrl}" style="max-height:100vh;max-width:100vw;object-fit:contain;"></body>`);
    }

    function formatTime(timestamp) {
      const d = new Date(timestamp);
      return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }

    function escapeHtml(str) {
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }
  </script>
</body>
</html>
